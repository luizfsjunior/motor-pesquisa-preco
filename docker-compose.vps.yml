# Overlay Docker na Oracle VPS: scheduler enxerga Chrome CDP no host (porta 9222).
services:
  scheduler:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SHOPEE_CDP_URL: http://host.docker.internal:9222
      SHOPEE_CDP_STRICT: "false"
      SHOPEE_INTERACTIVE: "false"
      SHOPEE_FALLBACK_ONLY: "false"
    depends_on: []

  dashboard:
    extra_hosts:
      - "host.docker.internal:host-gateway"
