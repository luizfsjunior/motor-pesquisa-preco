name: Price Monitor

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache database
        uses: actions/cache@v4
        with:
          path: data/prices.db
          key: prices-db-${{ github.ref_name }}
          restore-keys: |
            prices-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run price monitor cycle
        env:
          HEADLESS: "true"
          DATABASE_URL: sqlite:///data/prices.db
          LOG_LEVEL: INFO
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Plano B Shopee: DuckDuckGo + enrich (sem CDP no Actions)
          SHOPEE_FALLBACK_ONLY: "true"
          SHOPEE_CDP_URL: ""
          SHOPEE_INTERACTIVE: "false"
          SHOPEE_CDP_STRICT: "false"
        run: |
          python -m app.cli run-once 2>&1 | tee cycle.log
          echo "--- tail cycle.log ---"
          tail -n 80 cycle.log
          grep -E "CYCLE SUMMARY|Cycle collected zero|Telegram message sent|Scraper returned 0" cycle.log || true

      - name: Upload cycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-log
          path: cycle.log
          if-no-files-found: ignore

      - name: Upload debug session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-session-log
          path: debug-a309ad.log
          if-no-files-found: ignore

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: prices-db
          path: data/prices.db
          if-no-files-found: warn

      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/
          if-no-files-found: ignore
