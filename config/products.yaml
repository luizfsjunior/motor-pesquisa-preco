product:
  main_term: "Nintendo Switch 2"

  search_terms:
    - "Nintendo Switch 2"
    - "Nintendo Switch 2 OLED"
    - "Nintendo Switch 2 Mario Kart Bundle"
    - "Nintendo Switch 2 bundle"

  ignored_terms:
    - "case"
    - "capa"
    - "película"
    - "pelicula"
    - "skin"
    - "adesivo"
    - "grip"
    - "dock"
    - "shell"
    - "carregador"
    - "controle"
    - "acessório"
    - "suporte"
    - "estojo"
    - "bolsa"
    - "reparo"
    - "peça"
    - "peca"
    - "bq24193"
    - "de carga"
    - "ci bq"
    - "virtual boy"
    - "virtual"

  relevance:
    must_contain_any:
      - "switch 2"
      - "switch ii"
    exclude_terms:
      - "switch lite"
      - "family computer"
      - "mini weekly"
      - "windjammers"
      - "odyssey"
      - "pokemon legends"
      - "resident evil"
      - "tears of"
      - "zelda:"
      - "super mario odyssey"
      - "renewed"
      - "nintendo switch switch 32"
      - "versão americana"
      - "versao americana"
      - "version americana"
      - "compra internacional"
      - "importado"
      - "virtual boy"
      - "virtual"
    min_console_price: 2000
    console_keywords:
      - "console"
      - "consola"
      - "system"
      - "nova geracao"
      - "nova geração"
      - "256gb"
      - "256 gb"
    game_markers:
      - "jogo"
      - "game"
      - "midia fisica"
      - "mídia física"
      - "digital)"
      - "(digital"
      - " digital"
      - "+ dlc"
      - "dlc)"
      - "limited run"
      - "video game"
      - "edição"
      - "edicao"
      - "bananza"
      - "donkey kong"
      - "mario kart world"
      - "kart world"

  normalization_rules:
    - ["switch2", "switch 2"]
    - ["oled", "OLED"]
    - ["nintendo switch ii", "nintendo switch 2"]

  expected_price_range:
    min: 2500
    max: 6000

  suspicious_price_factor: 0.55

marketplaces:
  shopee: true
  mercadolivre: true
  google_shopping: true
  # Shopee: busca nativa primeiro (search na Shopee); DDG/Bing/Google só se falhar
  shopee_options:
    prefer_external_search_first: false
    skip_out_of_stock: true
    use_clean_browser_for_external: true
    accept_discovery_without_price: true
    minimum_trust_score_discovery: 25
    price_enrich_max_urls: 12
    product_page_wait_until: domcontentloaded
    duckduckgo_site_fallback: true
    bing_site_fallback: true
    google_site_fallback: true
    warmup_home: false
    watch_urls: []
  amazon: false
  kabum: false

filters:
  only_new_products: true
  only_national_results: true
  minimum_store_rating: 4.5
  minimum_store_sales: 50

alerts:
  minimum_discount_percent: 10
  notify_new_lowest_price: true
  notify_new_products: true
  # Resumo Telegram: menor preço entre itens coletados abaixo deste valor (mesmo se não passar filtros)
  fallback_max_price: 4000

scheduler:
  interval_minutes: 15

scraping:
  max_pages: 2
  scroll_pause_ms: 800
  request_timeout_ms: 30000

trust:
  minimum_score_to_alert: 40
  minimum_score_to_persist: 30

promotion:
  abnormal_drop_percent: 25
  history_days_for_average: 30
